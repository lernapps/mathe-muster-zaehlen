# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Das brauchst du hier
description: "Das brauchst du für dieses Kapitel: Stellenwerte und Vorrangregeln mit Rechengesetzen, mit Begriffen, Beispielen und einem Selbsttest."
recap:
  - mathematik/natuerliche-zahlen
  - mathematik/grundrechenarten-rechengesetze
blocks:
  - type: section
    id: kopf
    title: Das brauchst du für dieses Kapitel
    blocks:
      - type: text
        text: |
          Mira (11) und Ben (10) richten die Spielecke ihrer Klasse ein und planen ein Fest zur Eröffnung. Dafür legen sie
          viele Plättchen aus. Mit Stellenwerten bündelst du Plättchen zu Zehnerpotenzen, mit den Rechenregeln
          beschreibst du Muster. Teste dich in beiden Teilen: erst im Kopf rechnen, dann die Lösung lesen.
  - type: section
    id: stellenwert
    title: Natürliche Zahlen im Stellenwertsystem
    blocks:
      - type: text
        text: |
          Jede **Ziffer** einer Zahl hat einen **Stellenwert**. Die Stellen heißen Einer (E), Zehner (Z), Hunderter (H)
          und Tausender (T). Weiter links folgen Zehntausender, Hunderttausender und Millionen. Die
          **Stellenwerttafel** zeigt sie nebeneinander.
      - type: definition
        term: Ziffer
        explanation: Ziffern sind die Zeichen 0 bis 9, aus denen Zahlen bestehen. Die Zahl 2407 hat die Ziffern 2, 4, 0 und 7.
      - type: definition
        term: Stellenwert
        explanation: Der Stellenwert sagt, wie viel eine Ziffer an ihrer Stelle zählt. Jede Stelle ist zehnmal so viel wert wie die Stelle rechts davon. In 2407 steht die Ziffer 4 bei den Hundertern, ihr Wert ist 4 · 100 = 400.
      - type: definition
        term: Stellenwerttafel
        explanation: Die Stellenwerttafel gibt jeder Stelle einer Zahl eine Spalte. Von links nach rechts stehen T, H, Z, E, und 2407 steht darin als 2, 4, 0, 7.
      - type: table
        caption: "Die Zahl 2407 in der Stellenwerttafel: T Tausender, H Hunderter, Z Zehner, E Einer"
        header: ["T", "H", "Z", "E"]
        rows:
          - ["2", "4", "0", "7"]
      - type: example
        title: 2407 gelesen
        blocks:
          - type: text
            text: 2407 sind 2 Tausender, 4 Hunderter, 0 Zehner und 7 Einer. Die Null hält den Platz der Zehner frei.
      - type: section
        id: selbsttest-stellenwert
        title: Kannst du das?
        blocks:
          - type: vue-component
            id: test-stellenwert-wert
            component: Kurztest
            props:
              question: "Welchen Wert hat die Ziffer 7 in der Zahl 7305?"
              options:
                - { text: "7", correct: false, info: "Das ist die Ziffer selbst, nicht ihr Wert an dieser Stelle." }
                - {
                    text: "700",
                    correct: false,
                    info: "700 wäre der Wert bei den Hundertern. Die 7 steht aber ganz links, bei den Tausendern.",
                  }
                - { text: "7000", correct: true, info: "Die 7 steht bei den Tausendern, also 7 · 1000 = 7000." }
              right: Richtig.
              wrong: Nicht richtig.
            nojs: |
              Kurztest: Welchen Wert hat die Ziffer 7 in der Zahl 7305? Antwort: 7000. Die 7 steht bei den Tausendern, also 7 · 1000. Die Antwort 7 wäre die Ziffer selbst, 700 der Wert bei den Hundertern.
          - type: vue-component
            id: test-stellenwert-schreiben
            component: Kurztest
            props:
              question: "Welche Zahl sind 3 Tausender, 0 Hunderter, 5 Zehner und 2 Einer?"
              options:
                - {
                    text: "352",
                    correct: false,
                    info: "Hier fehlt die Null. Ohne sie rutschen die Ziffern an die falschen Stellen.",
                  }
                - {
                    text: "3052",
                    correct: true,
                    info: "Die Null hält die Hunderterstelle frei: 3 Tausender, 0 Hunderter, 5 Zehner, 2 Einer.",
                  }
                - {
                    text: "3502",
                    correct: false,
                    info: "Hier stehen die 5 bei den Hundertern und die 0 bei den Zehnern. Die Reihenfolge ist vertauscht.",
                  }
              right: Richtig.
              wrong: Nicht richtig.
            nojs: |
              Kurztest: Welche Zahl sind 3 Tausender, 0 Hunderter, 5 Zehner und 2 Einer? Antwort: 3052. Die Null hält die Hunderterstelle frei. 352 hat keine Null, 3502 hat Hunderter und Zehner vertauscht.
          - type: text
            text: Nicht sicher? Lies den Baustein „Natürliche Zahlen im Stellenwertsystem“ auf der [Lernlandkarte](https://lernapps.net/apps/map/mathematik/c/natuerliche-zahlen/).
  - type: section
    id: vorrang
    title: Vorrangregeln und Rechengesetze
    blocks:
      - type: text
        text: |
          Eine **Summe** ist das Ergebnis einer Addition, ihre Zahlen heißen Summanden. Ein **Produkt** ist das
          Ergebnis einer Multiplikation, ihre Zahlen heißen Faktoren. Beim Rechnen mit mehreren Rechenzeichen gilt
          eine feste Reihenfolge, und drei Rechengesetze helfen dir, geschickt zu rechnen.
      - type: definition
        term: Vorrangregel
        explanation: Klammern werden zuerst gerechnet, danach mal (·) und geteilt (:) vor plus und minus, das heißt Punkt vor Strich. Gleichrangige Rechenzeichen rechnest du von links nach rechts. Beispiel 3 + 4 · 2 = 3 + 8 = 11, aber (3 + 4) · 2 = 7 · 2 = 14, und 20 − 5 − 3 = 15 − 3 = 12.
      - type: definition
        term: Kommutativgesetz
        explanation: Beim Addieren und beim Multiplizieren darfst du die Zahlen tauschen, beim Subtrahieren und Dividieren nicht. Beispiele 7 + 5 = 5 + 7 = 12 und 4 · 25 = 25 · 4 = 100, aber 8 − 3 = 5, während 3 − 8 keine natürliche Zahl ist.
      - type: definition
        term: Assoziativgesetz
        explanation: Beim Addieren und beim Multiplizieren darfst du die Klammern anders setzen, die Reihenfolge der Zahlen bleibt. Beispiel (2 · 5) · 10 = 2 · (5 · 10) = 100.
      - type: definition
        term: Distributivgesetz
        explanation: Ein Faktor vor einer Klammer wird mit jedem Summanden in der Klammer malgenommen. Beispiel 3 · (10 + 2) = 3 · 12 = 36 und 3 · 10 + 3 · 2 = 30 + 6 = 36.
      - type: example
        title: Mit Klammer und Punkt vor Strich
        blocks:
          - type: text
            text: "2 + 3 · (7 − 4): Die Klammer zuerst, 7 − 4 = 3. Dann Punkt vor Strich, 3 · 3 = 9. Zuletzt 2 + 9 = 11."
      - type: section
        id: selbsttest-vorrang
        title: Kannst du das?
        blocks:
          - type: vue-component
            id: test-vorrang-punkt
            component: Kurztest
            props:
              question: "Was ergibt 5 + 3 · 4?"
              options:
                - {
                    text: "32",
                    correct: false,
                    info: "Das ist (5 + 3) · 4. Ohne Klammer gilt Punkt vor Strich, also wird erst 3 · 4 gerechnet.",
                  }
                - { text: "17", correct: true, info: "Punkt vor Strich: erst 3 · 4 = 12, dann 5 + 12 = 17." }
                - { text: "12", correct: false, info: "Das ist nur 3 · 4. Danach kommt noch + 5." }
              right: Richtig.
              wrong: Nicht richtig.
            nojs: |
              Kurztest: Was ergibt 5 + 3 · 4? Antwort: 17. Punkt vor Strich: erst 3 · 4 = 12, dann 5 + 12 = 17. 32 wäre (5 + 3) · 4, 12 nur 3 · 4.
          - type: vue-component
            id: test-vorrang-verteilen
            component: Kurztest
            props:
              question: "Wie rechnest du 6 · 102 mit dem Distributivgesetz?"
              options:
                - {
                    text: "6 + 102 = 108",
                    correct: false,
                    info: "Das ist eine Addition. Bei 6 · 102 wird malgenommen.",
                  }
                - {
                    text: "6 · 100 + 6 · 2 = 612",
                    correct: true,
                    info: "102 = 100 + 2. Der Faktor 6 wird mit beiden Summanden multipliziert: 600 + 12 = 612.",
                  }
                - {
                    text: "6 · 100 · 2 = 1200",
                    correct: false,
                    info: "Hier wurde 100 · 2 gerechnet. Es muss 6 · 100 plus 6 · 2 heißen.",
                  }
              right: Richtig.
              wrong: Nicht richtig.
            nojs: |
              Kurztest: Wie rechnest du 6 · 102 mit dem Distributivgesetz? Antwort: 6 · 100 + 6 · 2 = 600 + 12 = 612. Die Rechnung 6 + 102 = 108 ist eine Addition, 6 · 100 · 2 = 1200 verteilt falsch.
          - type: text
            text: Nicht sicher? Lies den Baustein „Vorrangregeln und Rechengesetze“ auf der [Lernlandkarte](https://lernapps.net/apps/map/mathematik/c/grundrechenarten-rechengesetze/).
  - type: section
    id: bereit
    title: Du bist bereit, wenn du ...
    blocks:
      - type: text
        text: |
          - natürliche Zahlen im Stellenwertsystem lesen, schreiben und darstellen kannst, zum Beispiel sagst, was die 4 in 2407 wert ist,
          - Klammern und Vorrangregeln beachten und Rechengesetze für vorteilhaftes Rechnen nutzen kannst, zum Beispiel 5 + 3 · 4 richtig rechnest und 6 · 102 geschickt.

          Dann geht es los. Zuerst legen Mira und Ben Muster aus Plättchen.
