# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Die Regel finden
description: Du beschreibst ein Muster mit einer Regel, in der die Nummer des Bildes als Platzhalter steht, und rechnest damit jedes Bild aus.
competencies: [muster-zahlenfolgen]
blocks:
  - type: section
    id: einstieg
    title: Wie findest du Bild 10, ohne alle Bilder zu legen?
    blocks:
      - type: text
        text: Ben möchte wissen, wie viele Plättchen Bild 10 der Wandreihe hat. Er hat nicht genug Platz, alle Bilder zu legen.
      - type: figure
        image: images/folge-wand.svg
        alt: Drei Plättchenbilder nebeneinander. Bild 1 hat ein hohles Anfangsplättchen und eine Spalte aus 3 Plättchen. Bild 2 hat zwei Spalten, Bild 3 hat drei Spalten.
        caption: Dieselbe Wandreihe wie auf der Seite davor. Bild 1 hat 4 Plättchen, Bild 2 hat 7, Bild 3 hat 10.
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: number
        id: bild-zehn
        text: Wie viele Plättchen hat Bild 10?
        answer: 31
        tolerance: 0
        explanation: Bis Bild 10 kommen 9 Spalten mit je 3 Plättchen dazu, das sind 4 + 27 = 31.
        mistakes:
          - answer: 30
            message: Du hast 10 Spalten mit je 3 gezählt. Das Anfangsplättchen fehlt noch.
          - answer: 13
            message: Das sind die Plättchen von Bild 4. Setze die Folge bis Bild 10 fort.
  - type: section
    id: darstellung
    title: Wie rechnest du jedes Bild aus?
    blocks:
      - type: text
        text: |
          Wenn du jedes Bild ausrechnen willst, ohne alle zu legen, brauchst du eine Regel, die für alle Bilder gilt. Jedes Bild hat ein Anfangsplättchen und so viele Spalten aus 3 Plättchen, wie seine Nummer sagt. Bild 3 hat
          3 Spalten, Bild 10 hat 10 Spalten. Die Regel in Worten heißt: Rechne 3 mal die Nummer des Bildes und
          addiere 1. Jedes Bild bringt 3 Plättchen mehr, darum wird die Nummer mit 3 malgenommen.
      - type: text
        text: |
          Die Nummer des Bildes ändert sich, darum bekommt sie einen Platzhalter. Du schreibst einen Buchstaben, zum Beispiel $n$. Der Platzhalter $n$ steht für die Nummer des Bildes. Du setzt eine Zahl ein und
          rechnest aus. Eine Rechnung mit Platzhalter heißt Term, hier $3 \cdot n + 1$.
      - type: example
        title: Bild 100
        blocks:
          - type: text
            text: Für Bild 100 setzt du 100 ein. Dann rechnest du 3 · 100 + 1 = 301. Bild 100 hat 301 Plättchen.
  - type: section
    id: merke
    title: Welche Zahl setzt du in die Regel ein?
    blocks:
      - type: note
        title: Merke
        blocks:
          - type: text
            text: Die Nummer des Bildes und die Anzahl der Plättchen sind zwei verschiedene Zahlen. In die Regel setzt du die Nummer ein, heraus kommt die Anzahl.
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: single-choice
        id: regel-waehlen
        text: Eine Folge hat die Glieder 5, 9, 13, 17 (Bild 1 bis Bild 4). Welche Regel in Worten passt?
        options:
          - text: Addiere 4 zur Nummer des Bildes
            correct: false
            info: Bild 2 ergäbe 6, nicht 9.
          - text: Rechne 4 mal die Nummer des Bildes und addiere 1
            correct: true
            info: Für Bild 1 gilt 4 · 1 + 1 = 5, für Bild 4 gilt 4 · 4 + 1 = 17.
          - text: Rechne 4 mal die Nummer des Bildes
            correct: false
            info: Bild 1 ergäbe 4, nicht 5.
          - text: Rechne 5 mal die Nummer des Bildes
            correct: false
            info: Bild 2 ergäbe 10, nicht 9.
        explanation: Mal 4, danach plus 1.
      - type: single-choice
        id: term-waehlen
        text: Welcher Term beschreibt die Folge 5, 9, 13, 17, wenn $n$ die Nummer des Bildes ist?
        options:
          - text: 5 · n
            correct: false
            info: Für n = 2 ergibt der Term 10, nicht 9.
          - text: 4 · n + 1
            correct: true
            info: Für n = 1 ergibt der Term 5, für n = 4 ergibt er 17.
          - text: n + 4
            correct: false
            info: Für n = 2 ergibt der Term 6, nicht 9.
          - text: 4 · n
            correct: false
            info: Für n = 1 ergibt der Term 4, nicht 5.
        explanation: Vor n steht der Abstand 4, danach kommt 1 dazu.
      - type: generated
        id: bild-ausrechnen
        given:
          a: { int: [2, 6] }
          c: { int: [1, 5] }
          n: { int: [5, 20] }
        where: ["a * n != a + n + c and a != c"]
        task:
          text: "Zu einem Muster gehört die Regel: Rechne {{a}} mal die Nummer des Bildes und addiere {{c}}. Wie viele Plättchen hat Bild {{n}}?"
        answer: { value: "a * n + c", compare: { number: { format: integer } } }
        mistakes:
          - value: "a * n"
            message: "Du hast das Addieren von {{c}} vergessen."
          - value: "a * (n + c)"
            message: "Du hast erst {{n}} + {{c}} gerechnet. Die Regel sagt: erst mal {{a}}, dann plus {{c}}."
          - value: "a + n + c"
            message: "Du hast alles addiert. Die Nummer des Bildes wird mit {{a}} malgenommen."
        hint: "Setze {{n}} für die Nummer des Bildes ein. Was rechnest du zuerst?"
        steps:
          - "Setze die Nummer {{n}} ein: {{a}} mal {{n}} plus {{c}}."
          - "Punkt vor Strich: erst das Produkt, dann plus {{c}}. Das Ergebnis ist {{answer}}."
      - type: true-false
        id: bild-fuenfzig
        text: "Mira rechnet für Bild 50 der Wandreihe: 3 · 50 + 1 = 151 Plättchen. Stimmt das?"
        answer: true
        explanation: Für Bild 50 ist das 150 + 1 = 151.
      - type: number
        id: welches-bild
        text: Zur Wandreihe gehört die Regel 3 mal die Nummer des Bildes plus 1. Welches Bild hat 40 Plättchen? Gib die Nummer an.
        answer: 13
        tolerance: 0
        hint: Gehe die Regel rückwärts. Was kommt zuletzt dazu?
        explanation: Ziehe 1 ab, das sind 39. Dann teilst du durch 3 und erhältst 13. Probe 3 · 13 + 1 = 40.
        mistakes:
          - answer: 40
            message: Das ist die Anzahl der Plättchen. Gefragt ist die Nummer des Bildes.
          - answer: 12
            message: Mache die Probe. Bild 12 hat 3 · 12 + 1 = 37 Plättchen, nicht 40.
  - type: section
    id: weiter
    title: Das kannst du jetzt
    blocks:
      - type: text
        text: Du kannst die Regel eines Musters in Worten und mit einem Platzhalter sagen und jedes Bild ausrechnen. Als Nächstes legen Mira und Ben Quadrate und Würfel und lernen eine neue Schreibweise.
