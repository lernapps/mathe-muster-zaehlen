# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Quadrat- und Kubikzahlen
description: Du legst Quadrate und Würfel aus Plättchen und liest die Potenz als wiederholtes Malnehmen.
competencies: [potenzen]
blocks:
  - type: section
    id: einstieg
    title: Zuerst zählen
    blocks:
      - type: text
        text: |
          Ben legt für die Bauecke ein Quadrat aus Plättchen. Danach kannst du Quadrate und Würfel aus Plättchen als
          Potenzen schreiben und ausrechnen.
      - type: figure
        image: images/quadrat-vier.svg
        alt: Ein Quadrat aus Plättchen mit 4 Reihen. In jeder Reihe liegen 4 Plättchen.
        caption: Achte auf die Reihen. Wie viele Plättchen liegen in einer Reihe, wie viele Reihen gibt es?
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: number
        id: quadrat-vier-zaehlen
        text: Wie viele Plättchen hat Bens Quadrat?
        answer: 16
        tolerance: 0
        explanation: 4 Reihen mit je 4 Plättchen sind 4 · 4 = 16 Plättchen. So rechnest du schneller als beim Abzählen.
        mistakes:
          - answer: 8
            message: Du hast 4 + 4 gerechnet. Es sind 4 Reihen, und in jeder liegen 4 Plättchen, also wird malgenommen.
        links:
          - title: Quadratzahl (Wikipedia)
            url: "https://de.wikipedia.org/wiki/Quadratzahl"
  - type: section
    id: darstellung
    title: Gleiche Faktoren kurz schreiben
    blocks:
      - type: text
        text: |
          Im Quadrat sind beide Zahlen gleich: 4 Reihen mal 4 Plättchen. Statt 4 · 4 schreibst du kurz $4^2$ und
          sprichst „4 hoch 2“. Das Ergebnis heißt Quadratzahl.
      - type: definition
        term: Potenz
        explanation: Eine Potenz ist ein Produkt aus gleichen Faktoren, zum Beispiel $4^2 = 4 \cdot 4$. Die untere Zahl heißt Basis, die kleine obere Zahl Exponent. Der Exponent sagt, wie oft die Basis als Faktor vorkommt.
      - type: figure
        image: images/wuerfel-drei-lagen.svg
        alt: Drei Lagen aus Plättchen nebeneinander gezeichnet, Lage 1, Lage 2 und Lage 3. Jede Lage hat 3 Reihen mit je 3 Plättchen.
        caption: Die drei Lagen liegen im Würfel übereinander. Jede Lage ist ein Quadrat aus 3 mal 3 Plättchen.
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: text
        text: |
          Legst du drei solche Quadrate übereinander, entsteht ein Würfel. Dann kommt die Basis dreimal als Faktor vor.
          Das Ergebnis heißt Kubikzahl.
      - type: example
        title: Ein Würfel mit Kante 3
        blocks:
          - type: formula
            formula: '3^3 = 3 \cdot 3 \cdot 3 = 9 \cdot 3 = 27'
          - type: text
            text: Eine Lage hat 3 · 3 = 9 Plättchen. Drei Lagen haben 9 · 3 = 27 Plättchen.
  - type: section
    id: merke
    title: Das verwechseln viele
    blocks:
      - type: note
        title: Merke
        blocks:
          - type: text
            text: Der Exponent sagt nicht, womit du malnimmst. $3^4$ heißt 3 · 3 · 3 · 3 = 81 und nicht 3 · 4 = 12.
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: number
        id: quadrat-fuenf
        text: Ein Quadrat hat 5 Reihen mit je 5 Plättchen. Wie viele Plättchen sind das?
        answer: 25
        tolerance: 0
        explanation: 5 · 5 = 25, kurz $5^2$. Die Basis 5 kommt zweimal als Faktor vor.
        mistakes:
          - answer: 10
            message: Du hast 5 + 5 gerechnet. Bei Reihen mal Plättchen wird malgenommen.
        links:
          - title: Quadratzahl (Wikipedia)
            url: "https://de.wikipedia.org/wiki/Quadratzahl"
      - type: generated
        id: potenz-berechnen
        given:
          b: { int: [3, 6] }
          e: { int: [2, 4] }
        where: ["b != e and not (b == 4 and e == 2)"]
        task:
          text: "Berechne ${{b}}^{{{e}}}$."
        answer: { value: "pow(b, e)", compare: { number: { format: integer } } }
        mistakes:
          - value: "b * e"
            message: "Du hast {{b}} · {{e}} gerechnet. Der Exponent {{e}} sagt, wie oft die Basis {{b}} als Faktor vorkommt."
          - value: "b + e"
            message: "Du hast {{b}} + {{e}} gerechnet. Eine Potenz ist ein Produkt aus gleichen Faktoren."
          - value: "pow(e, b)"
            message: "Du hast Basis und Exponent vertauscht. Die Basis ist die untere Zahl."
        hint: "Schreibe die Potenz als Produkt: {{b}} kommt {{e}}-mal als Faktor vor."
        steps:
          - "Die Basis {{b}} wird {{e}}-mal als Faktor geschrieben und malgenommen."
          - "Rechne das Produkt von links nach rechts aus: Das Ergebnis ist {{answer}}."
      - type: matching
        id: potenz-und-faktoren
        text: Ordne jeder Potenz das passende Produkt zu.
        pairs:
          - left: Die Potenz 2³
            right: 2 · 2 · 2 (drei Faktoren)
          - left: Die Potenz 5²
            right: 5 · 5 (zwei Faktoren)
          - left: Die Potenz 3⁴
            right: 3 · 3 · 3 · 3 (vier Faktoren)
          - left: Die Potenz 10²
            right: 10 · 10 (zwei Faktoren)
        explanation: Der Exponent sagt, wie viele gleiche Faktoren es sind. Die Basis ist der Faktor selbst.
        links:
          - title: Potenz (Wikipedia)
            url: "https://de.wikipedia.org/wiki/Potenz_(Mathematik)"
      - type: true-false
        id: drei-hoch-vier
        text: "$3^4$ ist dasselbe wie 3 · 4."
        answer: false
        explanation: $3^4$ ist 3 · 3 · 3 · 3 = 81. Das Produkt 3 · 4 ist nur 12.
        links:
          - title: Potenz (Wikipedia)
            url: "https://de.wikipedia.org/wiki/Potenz_(Mathematik)"
      - type: number
        id: wuerfel-vier
        text: Mira legt einen Würfel mit Kante 4. Er hat 4 Lagen, jede Lage ist ein Quadrat aus 4 mal 4 Plättchen. Wie viele Plättchen braucht sie?
        answer: 64
        tolerance: 0
        explanation: Eine Lage hat 4 · 4 = 16 Plättchen. Vier Lagen sind 16 · 4 = 64, also $4^3$ ist 4 · 4 · 4 = 64.
        mistakes:
          - answer: 16
            message: Das ist nur eine Lage. Der Würfel hat 4 Lagen übereinander.
          - answer: 12
            message: Du hast 4 · 3 gerechnet. Die Basis 4 kommt dreimal als Faktor vor.
        links:
          - title: Kubikzahl (Wikipedia)
            url: "https://de.wikipedia.org/wiki/Kubikzahl"
  - type: section
    id: weiter
    title: Das kannst du jetzt
    blocks:
      - type: text
        text: Du kannst eine Potenz als Produkt gleicher Faktoren lesen und ausrechnen. Die Bauecke steht. Als Nächstes zählen Mira und Ben mit Zehnerpotenzen die Plättchen in der Dose.
